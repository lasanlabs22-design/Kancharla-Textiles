<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kancharla Textiles · Choose the hero photo</title>
<style>
  body { margin: 0; background: #FBF8F3; color: #1F1A17; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { padding: 28px 24px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { font: 400 34px Georgia, serif; margin: 0 0 4px; letter-spacing: .02em; }
  p { margin: 0; color: #776C63; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  figure { margin: 0; background: #fff; border: 1px solid #E8E1D6; }
  img { width: 100%; height: 420px; object-fit: cover; object-position: 50% 25%; display: block; cursor: zoom-in; }
  figcaption { padding: 10px 14px; font-weight: 600; font-size: 18px; }
  .zoom { position: fixed; inset: 0; background: rgba(20,16,14,.9); display: none; align-items: center; justify-content: center; }
  .zoom img { width: auto; height: auto; max-width: 92vw; max-height: 92vh; object-fit: contain; cursor: zoom-out; }
  .zoom.on { display: flex; }
</style>
</head>
<body>
<header>
  <h1>Choose the landing photo</h1>
  <p>Click any photo to see it full size. Tell Claude the number you like (or two or three favourites).</p>
</header>
<div class="grid" id="grid"></div>
<div class="zoom" id="zoom"><img id="zoomImg" alt=""></div>
<script>
  const grid = document.getElementById("grid")
  const zoom = document.getElementById("zoom")
  const zoomImg = document.getElementById("zoomImg")
  for (let i = 1; i <= 24; i++) {
    const n = String(i).padStart(2, "0")
    const fig = document.createElement("figure")
    fig.innerHTML = `<img src="opt-${n}.jpg" alt="Option ${i}" loading="lazy"><figcaption>#${i}</figcaption>`
    fig.querySelector("img").onclick = () => { zoomImg.src = `opt-${n}.jpg`; zoom.classList.add("on") }
    grid.appendChild(fig)
  }
  zoom.onclick = () => zoom.classList.remove("on")
</script>
</body>
</html>
